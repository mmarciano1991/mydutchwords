# Supabase project config — used by the CLI and the GitHub integration.
# `project_id` is a local identifier only; the integration binds this repo to
# your dashboard project. Anything omitted here falls back to Supabase defaults.
project_id = "woordkast"

[db]
# Match your project's Postgres major version (Supabase projects default to 17).
major_version = 17

[auth]
# The site users are sent back to after email confirmation / OAuth. Override
# per environment in the dashboard (Authentication → URL Configuration).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.external.google]
# Google (Gmail) sign-in. The actual client id/secret live in the dashboard
# (or env), never in the repo.
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
# Sign in with Apple — required by App Review (guideline 4.8) alongside any
# other social login. The Services ID and the signing secret generated from
# the .p8 key live in the dashboard (or env), never in the repo. See
# docs/auth-setup.md.
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# Pronunciation (Azure neural voice). Callable without an account — the app
# works signed out — so no JWT check; the function only speaks short words.
[functions.tts]
verify_jwt = false

# Example sentences on demand, for dictionary senses that shipped without
# one. Callable without an account like tts; it only accepts dictionary
# sense ids and writes each sense's sentence once, which bounds the spend.
[functions.example]
verify_jwt = false
