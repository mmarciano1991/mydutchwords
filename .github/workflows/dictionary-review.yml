# Reviews the published dictionary's glosses and examples with a model and
# proposes corrections — never publishes them. See
# scripts/dictionary/review.mjs and docs/dictionary.md ("Quality review").
#
#   1. take the latest published dictionary (the dictionary-latest release)
#   2. review the next `limit` senses (or a pilot sample of every kind):
#      Haiku triage → Sonnet fixes for flagged senses → checks
#   3. push the results to a branch, dictionary-review/<run>, with the
#      report as the run summary
#
# A person reads the report and merges the branch; the next Dictionary run
# applies the corrections, after the build's own checks.
name: Dictionary review

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many senses to review"
        type: number
        default: 500
      pilot:
        description: "Sample every kind of sense (to measure) instead of the highest-priority ones"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Latest published dictionary
        run: |
          gh release download dictionary-latest --pattern dictionary.tar.gz --dir /tmp
          mkdir -p /tmp/dict && tar -xzf /tmp/dictionary.tar.gz -C /tmp/dict

      - name: Review
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=No API key::Add ANTHROPIC_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/dictionary/review.mjs --static=/tmp/dict/dictionary --limit=${{ inputs.limit }} ${{ inputs.pilot && '--pilot' || '' }}

      - name: Report
        if: always()
        run: cat data/review/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # Results (the review log, so no sense is paid for twice, and the
      # proposed corrections) go to their own branch for a person to merge.
      - name: Push to a review branch
        run: |
          branch="dictionary-review/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/review data/corrections
          git commit -m "Dictionary review: ${{ inputs.limit }} senses${{ inputs.pilot && ' (pilot)' || '' }}"
          git push origin "$branch"
          echo "Results on branch $branch" >> "$GITHUB_STEP_SUMMARY"
