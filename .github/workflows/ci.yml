# Runs on every push and pull request.
#
# Typecheck, lint, the unit and acceptance tests (the dictionary cases run
# against a fixture extracted from a real dictionary build), and the
# dictionary validator. A failure blocks the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must satisfy the devDependencies' own floor (see package.json
      # "engines"): jsdom 30 wants ^22.22.2 || ^24.15.0 || >=26.0.0, and the
      # undici it pulls in wants >=22.19.0. On Node 20 both install with only
      # an EBADENGINE *warning* and then fail at runtime — undici reads
      # `markAsUncloneable` from node:worker_threads, which Node 20 doesn't
      # have, so every jsdom test dies on
      # "webidl.util.markAsUncloneable is not a function".
      # 26 matches the version the suite is developed and verified against.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The dictionary lives on the server and is built by
      # .github/workflows/dictionary.yml. Here, the test fixture extracted
      # from a real build is checked by the same validator that gates
      # publishing — and the acceptance tests above run against it.
      - name: Validate dictionary fixture
        run: npm run validate
