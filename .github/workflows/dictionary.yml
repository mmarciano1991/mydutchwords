# Builds the dictionary from its sources and publishes it.
#
#   1. download   English + Dutch Wiktionary (kaikki.org), OpenTaal,
#                 frequency list, Tatoeba — cached between runs
#   2. build      words → uses → senses → examples, with the cross-source
#                 checks; disagreements go to the doubt queue, never out
#   3. model      (only when ANTHROPIC_API_KEY is set) shorten glosses by
#                 selection, write missing examples, check "same sense?"
#   4. validate   every published sense, every example, corpus coverage —
#                 the run stops here on any failure
#   5. publish    Supabase (when its secrets are set) and the static shards
#                 as the `dictionary-latest` release asset, for builds with no
#                 Supabase project
#
# The doubt queue is attached to the run (and written to dict_doubt): it is
# what a reviewer works through. Run it by hand, or let the weekly schedule
# pick up the sources' changes.
name: Dictionary

on:
  workflow_dispatch:
    inputs:
      # Off by default and never on the schedule: the model step writes and
      # checks every missing example with the large models (hundreds of
      # dollars a run). Missing examples are written on demand instead
      # (supabase/functions/example) and quality is reviewed cheaply by
      # the Dictionary review workflow.
      model:
        description: "Run the model step (needs ANTHROPIC_API_KEY; costly)"
        type: boolean
        default: false
      publish:
        description: "Publish to Supabase and the release asset"
        type: boolean
        default: true
      # Cheap: shortens only the frequent glosses that still fail the gloss
      # rule (a selection from the source gloss, about a cent a gloss),
      # pushes the proposals to the branch dictionary-condensed for review,
      # and never publishes.
      glosses:
        description: "Shorten frequent too-long glosses with the model and push them for review (never publishes)"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: .cache/dictionary
          key: dictionary-sources-${{ github.run_id }}
          restore-keys: dictionary-sources-

      - name: Download sources
        run: npm run dictionary:download -- ${{ github.event_name == 'schedule' && '--force' || '' }}

      # Stable sense ids: reuse the ids already published, so no learner's
      # deck loses a sense to a reworded gloss.
      - name: Pull the sense-id registry
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: mkdir -p .cache/dictionary-build && npm run dictionary:publish -- --pull-registry

      # Without the model step, a sense gets an example from Wiktionary,
      # Tatoeba, data/examples or an on-demand sentence pulled above; the
      # rest ship as "Example coming soon" until a learner saves them.
      - name: Build
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ "${{ inputs.glosses }}" = "true" ]; then
            npm run dictionary:build -- --llm=glosses
          elif [ -n "$ANTHROPIC_API_KEY" ] && [ "${{ inputs.model }}" = "true" ]; then
            npm run dictionary:build -- --llm
          else
            echo "::notice title=Dictionary model step off::Senses with no example get one on demand (supabase/functions/example)."
            npm run dictionary:build
          fi

      - name: Validate
        run: npm run dictionary:validate

      # What the build still lacks (examples, translations, articles…), the
      # most frequent words first — the list to work down.
      - name: Audit completeness
        if: always()
        run: |
          {
            echo "## Dictionary completeness"
            npm run -s dictionary:audit -- --build --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always()
        run: |
          {
            echo "## Dictionary build"
            echo '```json'
            cat .cache/dictionary-build/report.json 2>/dev/null | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the doubt queue and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-doubt-queue
          path: |
            .cache/dictionary-build/doubt.jsonl
            .cache/dictionary-build/report.json
            .cache/dictionary-build/audit.json

      # The proposals are not applied until a person copies the lines they
      # agree with to data/corrections/condensed.tsv on main.
      - name: Push condensed glosses for review
        if: inputs.glosses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dictionary-condensed
          mkdir -p data/review
          cp .cache/dictionary-build/condensed.tsv data/review/condensed-proposed.tsv
          git add data/review/condensed-proposed.tsv
          git commit -m "Condensed glosses proposed by the model step"
          git push -f origin dictionary-condensed
          echo "Proposals on branch dictionary-condensed: $(grep -vc '^#' data/review/condensed-proposed.tsv) glosses" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && !inputs.glosses && (github.event_name == 'schedule' || inputs.publish)
        run: npm run dictionary:publish

      - name: Publish the static shards
        if: "!inputs.glosses && (github.event_name == 'schedule' || inputs.publish)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run dictionary:static -- dist-dictionary/dictionary
          tar -czf dictionary.tar.gz -C dist-dictionary dictionary
          gh release view dictionary-latest >/dev/null 2>&1 || gh release create dictionary-latest --title "Dictionary (latest build)" --notes "Static dictionary shards for builds without a Supabase project. Rebuilt by the Dictionary workflow."
          gh release upload dictionary-latest dictionary.tar.gz --clobber

      # Is the on-demand example function (supabase/functions/example)
      # deployed? A made-up sense id costs no model call: a deployed
      # function answers 422 "No such sense", a missing one 404.
      - name: Check the on-demand example function
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          code=$(curl -s -o /tmp/example.json -w '%{http_code}' -X POST "${SUPABASE_URL%/}/functions/v1/example" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{"senseId":"s_probe_not_a_sense"}')
          case "$code" in
            422) echo "On-demand examples: function deployed" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::warning title=On-demand examples::example function answered $code — deploy it (docs/example-setup.md)"
               echo "On-demand examples: function answered $code: $(head -c 200 /tmp/example.json)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      # The test fixture, from this build — commit it if the acceptance
      # cases should follow the new data.
      - name: Fixture from this build
        run: npm run dictionary:fixture
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-fixture
          path: src/lib/dictionary/fixture.json
